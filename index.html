<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Collection vinyle — LunaticPan</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="disc" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="15" fill="#ececf1" stroke="#8b8b96" stroke-width="0.4"/>
        <circle cx="16" cy="16" r="13" fill="none" stroke="#b8b8c2" stroke-width="0.4"/>
        <circle cx="16" cy="16" r="11" fill="none" stroke="#b8b8c2" stroke-width="0.4"/>
        <circle cx="16" cy="16" r="9"  fill="none" stroke="#b8b8c2" stroke-width="0.4"/>
        <circle cx="16" cy="16" r="6"  fill="#e6a23c"/>
        <circle cx="16" cy="16" r="1"  fill="#0e0e10"/>
      </svg>
      <h1>Collection LunaticPan</h1>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Chercher un artiste, un album..." autocomplete="off" />
      <span id="counts" class="counts"></span>
    </div>
  </header>

  <main class="layout">
    <aside id="sidebar" class="sidebar" aria-label="Liste des artistes">
      <div class="sidebar-head">Artistes <span id="artist-count"></span></div>
      <ol id="artist-list" class="artist-list"></ol>
    </aside>

    <section id="content" class="content">
      <div id="empty" class="empty">Selectionne un artiste a gauche.</div>
      <article id="artist-panel" class="artist-panel" hidden>
        <h2 id="artist-name"></h2>
        <p id="artist-meta" class="muted"></p>
        <div id="albums" class="albums"></div>
      </article>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-inner">
      <button class="modal-close" data-close aria-label="Fermer">&times;</button>
      <img id="modal-img" alt="" />
      <div id="modal-caption" class="modal-caption"></div>
    </div>
  </div>

  <script src="collection.js"></script>
  <script src="fiches.js"></script>
  <script src="covers.js"></script>
  <script src="app.js"></script>
</body>
</html>
